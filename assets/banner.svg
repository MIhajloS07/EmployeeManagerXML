<svg xmlns="http://www.w3.org/2000/svg" width="900" height="260" viewBox="0 0 900 260" role="img" aria-label="Employee Manager XML banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#512BD4"/>
      <stop offset="100%" stop-color="#00B4DB"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#fff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round"><rect width="900" height="260" rx="18"/></clipPath>
    <style>
      .title { font: 700 48px 'Segoe UI', Arial, sans-serif; fill: #fff; }
      .sub   { font: 500 19px 'Consolas', 'Courier New', monospace; fill: #e6faff; }
      .code  { font: 600 15px 'Consolas', 'Courier New', monospace; fill: #ffffff; opacity: .22; }
      .cursor { animation: blink 1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .fadein { opacity: 0; animation: fade 1.2s ease-out .2s forwards; }
      .fadein2 { opacity: 0; animation: fade 1.2s ease-out .8s forwards; }
      @keyframes fade { to { opacity: 1; } }
      .float1 { animation: float 6s ease-in-out infinite; }
      .float2 { animation: float 7.5s ease-in-out infinite reverse; }
      @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
  </defs>

  <g clip-path="url(#round)">
    <rect width="900" height="260" fill="url(#bg)"/>

    <!-- floating XML tags -->
    <g class="float1">
      <text class="code" x="40" y="60">&lt;Employee&gt;</text>
      <text class="code" x="690" y="215">&lt;/Employee&gt;</text>
    </g>
    <g class="float2">
      <text class="code" x="700" y="55">&lt;Role /&gt;</text>
      <text class="code" x="50" y="220">&lt;Age /&gt;</text>
    </g>

    <!-- title -->
    <text class="title fadein" x="450" y="125" text-anchor="middle">Employee Manager XML</text>

    <!-- subtitle with cursor -->
    <text class="sub fadein2" x="450" y="170" text-anchor="middle">&gt; CRUD console app · C# &amp; XML<tspan class="cursor">_</tspan></text>

    <!-- moving shine -->
    <rect y="0" width="260" height="260" fill="url(#shine)" transform="skewX(-20)">
      <animate attributeName="x" from="-400" to="1100" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
